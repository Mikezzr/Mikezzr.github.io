<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Electric vehicle routing publication preview</title>
  <desc id="desc">An electric vehicle route connecting charging stations and delivery points under changing traffic loads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532d"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#052e16" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <path d="M36 356 168 228l130 58 142-158 166 106 142-84" fill="none" stroke="#bbf7d0" stroke-opacity=".18" stroke-width="3"/>
  <path d="M36 385 168 257l130 58 142-158 166 106 142-84" fill="none" stroke="#bbf7d0" stroke-opacity=".1" stroke-width="3"/>
  <text x="64" y="66" fill="#dcfce7" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">EV ROUTING</text>
  <g filter="url(#shadow)">
    <path d="M122 320C204 136 298 350 394 188S590 122 678 270" fill="none" stroke="#fef3c7" stroke-width="12" stroke-linecap="round"/>
    <path d="M122 320C204 136 298 350 394 188S590 122 678 270" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="2 18" stroke-linecap="round"/>
  </g>
  <g stroke="#14532d" stroke-width="6">
    <circle cx="122" cy="320" r="24" fill="#fef3c7"/>
    <circle cx="245" cy="225" r="24" fill="#bbf7d0"/>
    <circle cx="394" cy="188" r="24" fill="#fef3c7"/>
    <circle cx="532" cy="167" r="24" fill="#bbf7d0"/>
    <circle cx="678" cy="270" r="24" fill="#fef3c7"/>
  </g>
  <g fill="#166534" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="122" y="326">S</text>
    <text x="245" y="231">D</text>
    <text x="394" y="194">⚡</text>
    <text x="532" y="173">D</text>
    <text x="678" y="276">T</text>
  </g>
  <text x="64" y="400" fill="#dcfce7" font-family="Arial, sans-serif" font-size="17">traffic-aware routes · real-time loads · charging</text>
