<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">RuleScript publication preview</title>
  <desc id="desc">A relational query plan transformed by a verified rewrite rule.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#082f49" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <path d="M64 92h672M64 360h672" stroke="#99f6e4" stroke-opacity=".18" stroke-width="2"/>
  <text x="64" y="66" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">RULESCRIPT</text>
  <g filter="url(#shadow)">
    <rect x="86" y="146" width="172" height="92" rx="14" fill="#f0fdfa"/>
    <rect x="314" y="126" width="172" height="132" rx="14" fill="#fef3c7"/>
    <rect x="542" y="146" width="172" height="92" rx="14" fill="#f0fdfa"/>
  </g>
  <g fill="none" stroke="#99f6e4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 192h44"/>
    <path d="M486 192h44"/>
    <path d="m288 176 18 16-18 16"/>
    <path d="m516 176 18 16-18 16"/>
  </g>
  <g fill="#155e75" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="172" y="184" font-size="19" font-weight="700">QUERY PLAN</text>
    <text x="172" y="212" font-size="16">scan → join</text>
    <text x="400" y="177" font-size="19" font-weight="700">VERIFIED</text>
    <text x="400" y="207" font-size="16">rewrite rule</text>
    <text x="400" y="233" font-size="16">match → transform</text>
    <text x="628" y="184" font-size="19" font-weight="700">OPTIMIZED</text>
    <text x="628" y="212" font-size="16">equivalent plan</text>
  </g>
  <text x="64" y="400" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="17">write once · verify once · deploy everywhere</text>
</svg>
