<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">FrontierCS publication preview</title>
  <desc id="desc">Open-ended computer science challenges evaluated by an automatic scoring loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1e1b4b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <circle cx="650" cy="86" r="150" fill="#c4b5fd" fill-opacity=".12"/>
  <circle cx="706" cy="368" r="110" fill="#f5d0fe" fill-opacity=".1"/>
  <text x="64" y="66" fill="#ede9fe" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">FRONTIERCS</text>
  <g filter="url(#shadow)">
    <rect x="76" y="126" width="210" height="198" rx="18" fill="#faf5ff"/>
    <rect x="324" y="126" width="198" height="198" rx="18" fill="#fef3c7"/>
    <rect x="560" y="126" width="164" height="198" rx="18" fill="#ecfeff"/>
  </g>
  <g fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 225h34"/>
    <path d="M522 225h30"/>
    <path d="m303 210 18 15-18 15"/>
    <path d="m537 210 18 15-18 15"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="181" y="166" fill="#4c1d95" font-size="19" font-weight="700">OPEN-ENDED</text>
    <text x="181" y="197" fill="#6d28d9" font-size="16">CS problems</text>
    <path d="M112 244h138M112 264h104M112 284h120" stroke="#c4b5fd" stroke-width="10" stroke-linecap="round"/>
    <text x="423" y="166" fill="#92400e" font-size="19" font-weight="700">EXECUTE</text>
    <text x="423" y="197" fill="#b45309" font-size="16">program + solution</text>
    <circle cx="423" cy="264" r="36" fill="none" stroke="#f59e0b" stroke-width="9"/>
    <path d="m410 264 10 10 20-24" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="642" y="166" fill="#155e75" font-size="19" font-weight="700">SCORE</text>
    <text x="642" y="197" fill="#0e7490" font-size="16">automatic</text>
    <path d="M600 278h84M600 278l22-31 18 18 26-42 18 28" fill="none" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
